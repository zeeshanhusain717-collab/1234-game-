name: Build Pirate Match 3D Saga APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: कोड चेकआउट
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Java 17 सेटअप
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Android SDK Licenses एक्सेप्ट करना (Fixes image error)
      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # Step 4: Gradle 8.5 सेटअप
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      # Step 5: डायरेक्टरी स्ट्रक्चर बनाना
      - name: Create Project Directories
        run: |
          mkdir -p app/src/main/java/com/tilematch/game
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

      # Step 6: Gradle Config फाइल्स जनरेट करना
      - name: Generate Gradle Configuration Files
        run: |
          # gradle.properties
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

          # settings.gradle
          cat > settings.gradle <<'EOF'
          pluginManagement { 
              repositories { 
                  google()
                  mavenCentral()
                  gradlePluginPortal() 
              } 
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { 
                  google()
                  mavenCentral() 
              }
          }
          rootProject.name = "TileMatchGame"
          include(":app")
          EOF

          # Root build.gradle
          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

          # App build.gradle
          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.tilematch.game"
              compileSdk 34
              defaultConfig {
                  applicationId "com.tilematch.game"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes { 
                  release { 
                      minifyEnabled false 
                  } 
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
              implementation "androidx.webkit:webkit:1.11.0"
          }
          EOF

      # Step 7: Android Manifest और Strings फाइल्स बनाना
      - name: Generate Android Manifest and Resources
        run: |
          # AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:permission="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="Pirate Match 3D Saga"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # strings.xml
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Pirate Match 3D Saga</string>
          </resources>
          EOF

      # Step 8: MainActivity.kt (WebView Container) बनाना
      - name: Generate Kotlin MainActivity
        run: |
          cat > app/src/main/java/com/tilematch/game/MainActivity.kt <<'EOF'
          package com.tilematch.game

          import android.annotation.SuppressLint
          import android.os.Bundle
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this)
                  setContentView(webView)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      useWideViewPort = true
                      loadWithOverviewMode = true
                      allowFileAccess = true
                      mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                  }

                  webView.webViewClient = WebViewClient()
                  webView.loadUrl("file:///android_asset/game.html")
              }

              override fun onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }
          }
          EOF

      # Step 9: Game HTML Engine (Assets) बनाना
      - name: Generate HTML Game Engine
        run: |
          cat > app/src/main/assets/game.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <title>Pirate Match 3D Saga</title>
          <style>
              :root {
                  --bg-dark: #070F1E;
                  --gold-primary: #FFD700;
                  --gold-dark: #B8860B;
                  --wood-border: #3D2612;
                  --wood-bg: #5C3A21;
                  --teal-light: #2EC4B6;
                  --crimson-red: #E63946;
              }
              * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
              body {
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                  background-color: var(--bg-dark);
                  color: #FFF;
                  height: 100vh;
                  width: 100vw;
                  overflow: hidden;
              }

              .screen {
                  width: 100%;
                  height: 100%;
                  display: none;
                  flex-direction: column;
                  position: absolute;
                  top: 0; left: 0;
                  z-index: 10;
              }
              .screen.active { display: flex; }

              /* MAP SCREEN */
              #map-screen {
                  background: radial-gradient(circle at 50% 20%, #0F2B48 0%, #040A14 100%);
                  overflow-y: auto;
                  position: relative;
              }
              .map-header {
                  position: sticky;
                  top: 0;
                  background: linear-gradient(180deg, rgba(7, 15, 30, 0.95) 0%, rgba(7, 15, 30, 0.7) 100%);
                  backdrop-filter: blur(12px);
                  padding: 12px 20px;
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                  z-index: 100;
                  border-bottom: 2px solid rgba(255, 215, 0, 0.3);
                  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
              }
              .map-title {
                  font-size: 20px;
                  font-weight: 900;
                  color: var(--gold-primary);
                  text-shadow: 0 2px 8px rgba(255, 215, 0, 0.5), 0 0 2px #000;
                  letter-spacing: 0.5px;
              }
              .coin-badge {
                  background: linear-gradient(135deg, #2A1A0A, #4A3018);
                  padding: 6px 14px;
                  border-radius: 20px;
                  font-weight: 800;
                  color: var(--gold-primary);
                  border: 2px solid var(--gold-primary);
                  box-shadow: inset 0 2px 4px rgba(255,255,255,0.2), 0 4px 8px rgba(0,0,0,0.5);
              }

              .map-viewport {
                  position: relative;
                  width: 100%;
                  max-width: 480px;
                  margin: 0 auto;
                  padding: 40px 0 120px 0;
                  min-height: 100vh;
              }

              .svg-path-layer {
                  position: absolute;
                  top: 0; left: 0;
                  width: 100%; height: 100%;
                  pointer-events: none;
                  z-index: 1;
              }

              .map-nodes-layer {
                  position: relative;
                  z-index: 2;
                  width: 100%;
                  height: 100%;
              }

              .level-node-wrapper {
                  position: absolute;
                  transform: translate(-50%, -50%);
                  display: flex;
                  flex-direction: column;
                  align-items: center;
              }

              .level-node {
                  width: 64px;
                  height: 64px;
                  border-radius: 50%;
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  font-size: 20px;
                  font-weight: 900;
                  cursor: pointer;
                  position: relative;
                  border: 3px solid #FFF;
                  box-shadow: 0 8px 0px rgba(0,0,0,0.4), 0 10px 15px rgba(0,0,0,0.6);
                  transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
              }
              .level-node:active { transform: scale(0.88); }
              .level-node.unlocked {
                  background: radial-gradient(circle at 30% 30%, #34D399, #059669);
                  color: #FFF;
                  border-color: #A7F3D0;
              }
              .level-node.current {
                  background: radial-gradient(circle at 30% 30%, #FBBF24, #D97706);
                  color: #000;
                  border-color: #FEF08A;
                  animation: nodePulse 1.6s infinite alternate;
              }
              .level-node.locked {
                  background: radial-gradient(circle at 30% 30%, #475569, #1E293B);
                  color: #64748B;
                  border-color: #334155;
                  box-shadow: 0 4px 0px #0F172A;
              }

              @keyframes nodePulse {
                  0% { transform: scale(1); box-shadow: 0 0 0px var(--gold-primary); }
                  100% { transform: scale(1.12); box-shadow: 0 0 25px var(--gold-primary); }
              }

              .node-stars-badge {
                  position: absolute;
                  bottom: -14px;
                  background: rgba(15, 23, 42, 0.9);
                  border: 1px solid var(--gold-primary);
                  padding: 2px 8px;
                  border-radius: 12px;
                  font-size: 10px;
                  white-space: nowrap;
                  box-shadow: 0 4px 8px rgba(0,0,0,0.5);
              }

              /* GAMEPLAY SCREEN */
              #game-header {
                  padding: 12px 16px;
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                  background: linear-gradient(180deg, rgba(15, 23, 42, 0.9) 0%, rgba(15, 23, 42, 0.4) 100%);
              }
              .btn-nav {
                  background: linear-gradient(180deg, #3B82F6, #1D4ED8);
                  border: 1px solid #60A5FA;
                  color: white;
                  padding: 8px 16px;
                  border-radius: 16px;
                  font-weight: 800;
                  font-size: 13px;
                  cursor: pointer;
                  box-shadow: 0 4px 0 #1E3A8A;
              }
              .btn-nav:active { transform: translateY(2px); box-shadow: 0 2px 0 #1E3A8A; }

              #canvas-stage-container {
                  position: relative;
                  flex: 1;
                  width: 100%;
                  max-width: 480px;
                  margin: 0 auto;
                  display: flex;
                  justify-content: center;
                  align-items: center;
              }

              #game-canvas {
                  width: 100%;
                  height: 100%;
                  touch-action: none;
              }

              #tray-wrapper {
                  width: 94%;
                  max-width: 440px;
                  height: 84px;
                  margin: 0 auto 12px auto;
                  background: linear-gradient(180deg, var(--wood-bg) 0%, var(--wood-border) 100%);
                  border: 3px solid var(--gold-primary);
                  border-radius: 22px;
                  padding: 6px;
                  display: flex;
                  gap: 6px;
                  box-shadow: inset 0 4px 8px rgba(0,0,0,0.8), 0 8px 20px rgba(0,0,0,0.6);
              }
              .tray-slot {
                  flex: 1;
                  height: 100%;
                  border-radius: 14px;
                  background: rgba(0, 0, 0, 0.35);
                  border: 1.5px dashed rgba(255, 215, 0, 0.25);
                  display: flex;
                  justify-content: center;
                  align-items: center;
              }

              #booster-bar {
                  display: flex;
                  justify-content: center;
                  gap: 10px;
                  padding-bottom: 20px;
              }
              .btn-booster {
                  background: linear-gradient(180deg, #2563EB 0%, #1D4ED8 100%);
                  border: 1.5px solid #93C5FD;
                  color: white;
                  padding: 10px 14px;
                  border-radius: 18px;
                  font-weight: 800;
                  font-size: 12px;
                  box-shadow: 0 5px 0 #1E3A8A, 0 8px 12px rgba(0,0,0,0.4);
                  cursor: pointer;
                  display: flex;
                  align-items: center;
                  gap: 6px;
              }
              .btn-booster:active { transform: translateY(3px); box-shadow: 0 2px 0 #1E3A8A; }

              /* MODALS */
              .modal-backdrop {
                  position: fixed;
                  top: 0; left: 0; width: 100%; height: 100%;
                  background: rgba(0,0,0,0.82);
                  backdrop-filter: blur(8px);
                  display: none;
                  justify-content: center;
                  align-items: center;
                  z-index: 1000;
              }
              .modal-card {
                  background: linear-gradient(180deg, #1E293B 0%, #0F172A 100%);
                  border: 3px solid var(--gold-primary);
                  border-radius: 28px;
                  padding: 28px 24px;
                  text-align: center;
                  width: 85%;
                  max-width: 320px;
                  box-shadow: 0 15px 35px rgba(0,0,0,0.8);
                  animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
              }
              @keyframes modalPop {
                  0% { transform: scale(0.7); opacity: 0; }
                  100% { transform: scale(1); opacity: 1; }
              }
              .modal-btn {
                  margin-top: 20px;
                  width: 100%;
                  padding: 14px;
                  background: linear-gradient(180deg, #10B981 0%, #047857 100%);
                  border: 1.5px solid #6EE7B7;
                  color: white;
                  border-radius: 20px;
                  font-size: 16px;
                  font-weight: 900;
                  cursor: pointer;
                  box-shadow: 0 6px 0 #064E3B;
              }
              .modal-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #064E3B; }
          </style>
          </head>
          <body>

          <!-- MAP SCREEN -->
          <div id="map-screen" class="screen active">
              <div class="map-header">
                  <div class="map-title">🏴‍☠️ Pirate Match 3D</div>
                  <div class="coin-badge">🪙 <span id="map-coins-val">100</span></div>
              </div>
              <div class="map-viewport" id="map-viewport">
                  <svg class="svg-path-layer" id="svg-path-layer"></svg>
                  <div class="map-nodes-layer" id="map-nodes-layer"></div>
              </div>
          </div>

          <!-- GAMEPLAY SCREEN -->
          <div id="game-screen" class="screen">
              <div id="game-header">
                  <button class="btn-nav" onclick="exitToMap()">🗺️ Map</button>
                  <div style="font-size: 18px; font-weight: 900; color: var(--gold-primary);" id="hud-level-title">Level 1</div>
                  <div style="font-size: 15px; font-weight: 800;" id="hud-timer">⏱️ 00:00</div>
              </div>

              <div id="canvas-stage-container">
                  <canvas id="game-canvas"></canvas>
              </div>

              <div id="tray-wrapper">
                  <div class="tray-slot"></div><div class="tray-slot"></div>
                  <div class="tray-slot"></div><div class="tray-slot"></div>
                  <div class="tray-slot"></div><div class="tray-slot"></div>
                  <div class="tray-slot"></div>
              </div>

              <div id="booster-bar">
                  <button class="btn-booster" onclick="triggerUndo()">↩ Undo (🪙30)</button>
                  <button class="btn-booster" onclick="triggerWand()">🪄 Wand (🪙100)</button>
                  <button class="btn-booster" onclick="triggerShuffle()">🔀 Shuffle (🪙50)</button>
              </div>
          </div>

          <!-- WIN MODAL -->
          <div id="win-modal" class="modal-backdrop">
              <div class="modal-card">
                  <h2 style="color:var(--gold-primary); font-size:24px; font-weight:900;">LEVEL CLEARED!</h2>
                  <div id="win-stars-display" style="font-size:32px; margin: 14px 0;">⭐⭐⭐</div>
                  <p style="color:#34D399; font-weight:800;">Reward: +50 Coins 🪙</p>
                  <button class="modal-btn" onclick="claimWinAndNext()">CONTINUE ➔</button>
              </div>
          </div>

          <!-- LOSE MODAL -->
          <div id="lose-modal" class="modal-backdrop">
              <div class="modal-card" style="border-color: var(--crimson-red);">
                  <h2 style="color:var(--crimson-red); font-size:24px; font-weight:900;">OUT OF SLOTS!</h2>
                  <p style="color:#94A3B8; margin-top:10px;">The tray is full. Try again!</p>
                  <button class="modal-btn" style="background: linear-gradient(180deg, #EF4444, #B91C1C); border-color:#FCA5A5; box-shadow:0 6px 0 #7F1D1D;" onclick="retryLevel()">RETRY ↺</button>
              </div>
          </div>

          <script>
              let audioCtx = null;
              function getAudioContext() {
                  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                  if (audioCtx.state === 'suspended') audioCtx.resume();
                  return audioCtx;
              }
              function playSynthNote(freq, type, duration, gainVal) {
                  try {
                      const ctx = getAudioContext();
                      const osc = ctx.createOscillator();
                      const gain = ctx.createGain();
                      osc.type = type;
                      osc.frequency.setValueAtTime(freq, ctx.currentTime);
                      gain.gain.setValueAtTime(gainVal, ctx.currentTime);
                      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
                      osc.connect(gain); gain.connect(ctx.destination);
                      osc.start(); osc.stop(ctx.currentTime + duration);
                  } catch(e){}
              }
              function soundTap() { playSynthNote(580, 'sine', 0.08, 0.2); }
              function soundMatch() { 
                  playSynthNote(523.25, 'triangle', 0.1, 0.2);
                  setTimeout(() => playSynthNote(659.25, 'triangle', 0.15, 0.2), 60);
                  setTimeout(() => playSynthNote(783.99, 'triangle', 0.2, 0.25), 120);
              }
              function soundWin() {
                  [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                      setTimeout(() => playSynthNote(f, 'sine', 0.25, 0.25), i * 100);
                  });
              }

              let userState = {
                  unlocked: parseInt(localStorage.getItem('pirate_v2_unlocked')) || 1,
                  coins: parseInt(localStorage.getItem('pirate_v2_coins')) || 100,
                  stars: JSON.parse(localStorage.getItem('pirate_v2_stars')) || {}
              };
              function saveState() {
                  localStorage.setItem('pirate_v2_unlocked', userState.unlocked);
                  localStorage.setItem('pirate_v2_coins', userState.coins);
                  localStorage.setItem('pirate_v2_stars', JSON.stringify(userState.stars));
              }

              const TOTAL_LEVELS = 20;
              function renderSagaMap() {
                  document.getElementById('map-coins-val').innerText = userState.coins;
                  const nodesLayer = document.getElementById('map-nodes-layer');
                  const svgLayer = document.getElementById('svg-path-layer');
                  nodesLayer.innerHTML = '';
                  
                  const viewWidth = Math.min(window.innerWidth, 480);
                  const nodeSpacingY = 95;
                  const totalHeight = TOTAL_LEVELS * nodeSpacingY + 120;
                  
                  svgLayer.setAttribute('height', totalHeight);
                  document.getElementById('map-viewport').style.height = totalHeight + 'px';

                  const points = [];
                  for (let i = 1; i <= TOTAL_LEVELS; i++) {
                      const y = totalHeight - (i * nodeSpacingY);
                      const xOffset = Math.sin(i * 0.8) * (viewWidth * 0.28);
                      const x = (viewWidth / 2) + xOffset;
                      points.push({ level: i, x, y });
                  }

                  let pathD = `M ${points[0].x} ${points[0].y}`;
                  for (let i = 0; i < points.length - 1; i++) {
                      const p1 = points[i];
                      const p2 = points[i + 1];
                      const cx = (p1.x + p2.x) / 2;
                      const cy = (p1.y + p2.y) / 2;
                      pathD += ` Q ${p1.x} ${cy}, ${p2.x} ${p2.y}`;
                  }

                  svgLayer.innerHTML = `
                      <path d="${pathD}" fill="none" stroke="rgba(0, 0, 0, 0.4)" stroke-width="14" stroke-linecap="round"/>
                      <path d="${pathD}" fill="none" stroke="#FFD700" stroke-width="6" stroke-dasharray="8 6" stroke-linecap="round"/>
                  `;

                  points.forEach(p => {
                      const wrapper = document.createElement('div');
                      wrapper.className = 'level-node-wrapper';
                      wrapper.style.left = `${p.x}px`;
                      wrapper.style.top = `${p.y}px`;

                      const node = document.createElement('div');
                      node.className = 'level-node';

                      const formattedNum = p.level < 10 ? `0${p.level}` : p.level;

                      if (p.level < userState.unlocked) {
                          node.classList.add('unlocked');
                          node.innerText = formattedNum;
                          const starText = userState.stars[p.level] || '⭐⭐⭐';
                          node.innerHTML += `<div class="node-stars-badge">${starText}</div>`;
                          node.onclick = () => launchLevel(p.level);
                      } else if (p.level === userState.unlocked) {
                          node.classList.add('current');
                          node.innerText = formattedNum;
                          node.onclick = () => launchLevel(p.level);
                      } else {
                          node.classList.add('locked');
                          node.innerText = '🔒';
                      }

                      wrapper.appendChild(node);
                      nodesLayer.appendChild(wrapper);
                  });
              }

              let activeLevel = 1;
              let canvas, ctx;
              let tiles3D = [], trayTiles = [], historyStack = [];
              let timerInterval = null, secondsPassed = 0;

              const TILE_W = 62, TILE_H = 72, TILE_DEPTH = 10;
              const TILE_COLORS = [
                  { top: '#EF4444', side: '#991B1B', text: '#FFF' },
                  { top: '#F59E0B', side: '#B45309', text: '#FFF' },
                  { top: '#10B981', side: '#047857', text: '#FFF' },
                  { top: '#3B82F6', side: '#1E40AF', text: '#FFF' },
                  { top: '#8B5CF6', side: '#6D28D9', text: '#FFF' },
                  { top: '#EC4899', side: '#BE185D', text: '#FFF' },
                  { top: '#06B6D4', side: '#0E7490', text: '#FFF' }
              ];

              function initCanvas() {
                  canvas = document.getElementById('game-canvas');
                  const container = document.getElementById('canvas-stage-container');
                  canvas.width = container.clientWidth * window.devicePixelRatio;
                  canvas.height = container.clientHeight * window.devicePixelRatio;
                  ctx = canvas.getContext('2d');
                  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
              }

              function generateSolvableLevel(lvl) {
                  tiles3D = []; trayTiles = []; historyStack = [];
                  const totalTriplets = Math.min(4 + lvl, 12);
                  let valuesPool = [];
                  for (let i = 1; i <= totalTriplets; i++) {
                      valuesPool.push(i, i, i);
                  }

                  const numLayers = Math.min(4, Math.floor(lvl / 3) + 2);
                  const stageWidth = canvas.width / window.devicePixelRatio;
                  const stageHeight = canvas.height / window.devicePixelRatio;
                  const centerX = stageWidth / 2;
                  const centerY = stageHeight / 2 - 20;

                  let idCounter = 0;
                  valuesPool.forEach((val, idx) => {
                      const layer = idx % numLayers;
                      const col = (idx % 4) - 1.5;
                      const row = Math.floor((idx / 4) % 4) - 1.5;

                      const x = centerX + (col * (TILE_W + 8)) + (layer * 5);
                      const y = centerY + (row * (TILE_H + 8)) - (layer * 6);

                      tiles3D.push({
                          id: idCounter++,
                          value: val,
                          layer: layer,
                          x: x, y: y,
                          w: TILE_W, h: TILE_H,
                          blocked: false
                      });
                  });

                  updateTileBlocking();
                  renderCanvasStage();
              }

              function updateTileBlocking() {
                  tiles3D.forEach(tile => {
                      let isBlocked = false;
                      tiles3D.forEach(other => {
                          if (other.layer > tile.layer) {
                              const overlapX = Math.abs(other.x - tile.x) < TILE_W * 0.75;
                              const overlapY = Math.abs(other.y - tile.y) < TILE_H * 0.75;
                              if (overlapX && overlapY) isBlocked = true;
                          }
                      });
                      tile.blocked = isBlocked;
                  });
              }

              function draw3DTile(t) {
                  const style = TILE_COLORS[(t.value - 1) % TILE_COLORS.length];
                  
                  ctx.save();
                  ctx.translate(t.x - t.w/2, t.y - t.h/2);

                  ctx.fillStyle = t.blocked ? '#1E293B' : style.side;
                  ctx.beginPath();
                  ctx.roundRect(0, TILE_DEPTH, t.w, t.h, 12);
                  ctx.fill();

                  ctx.fillStyle = t.blocked ? '#475569' : style.top;
                  ctx.beginPath();
                  ctx.roundRect(0, 0, t.w, t.h, 12);
                  ctx.fill();

                  ctx.strokeStyle = t.blocked ? '#334155' : 'rgba(255,255,255,0.6)';
                  ctx.lineWidth = 2;
                  ctx.stroke();

                  ctx.fillStyle = t.blocked ? '#94A3B8' : style.text;
                  ctx.font = '900 26px sans-serif';
                  ctx.textAlign = 'center';
                  ctx.textBaseline = 'middle';
                  ctx.fillText(t.value, t.w/2, t.h/2);

                  ctx.restore();
              }

              function renderCanvasStage() {
                  const stageW = canvas.width / window.devicePixelRatio;
                  const stageH = canvas.height / window.devicePixelRatio;
                  ctx.clearRect(0, 0, stageW, stageH);

                  tiles3D.sort((a, b) => a.layer - b.layer);
                  tiles3D.forEach(tile => draw3DTile(tile));
              }

              function handleStageClick(e) {
                  const rect = canvas.getBoundingClientRect();
                  const touchX = e.clientX - rect.left;
                  const touchY = e.clientY - rect.top;

                  let clickedTile = null;
                  for (let i = tiles3D.length - 1; i >= 0; i--) {
                      const t = tiles3D[i];
                      if (!t.blocked) {
                          if (touchX >= t.x - t.w/2 && touchX <= t.x + t.w/2 &&
                              touchY >= t.y - t.h/2 && touchY <= t.y + t.h/2) {
                              clickedTile = t;
                              break;
                          }
                      }
                  }

                  if (clickedTile && trayTiles.length < 7) {
                      soundTap();
                      tiles3D = tiles3D.filter(t => t.id !== clickedTile.id);
                      historyStack.push(clickedTile);
                      trayTiles.push(clickedTile);

                      updateTileBlocking();
                      renderCanvasStage();
                      renderTrayUI();
                      evaluateTrayMatches();
                  }
              }

              function renderTrayUI() {
                  const slots = document.querySelectorAll('.tray-slot');
                  slots.forEach(s => s.innerHTML = '');
                  trayTiles.forEach(tile => {
                      const slot = slots[trayTiles.indexOf(tile)];
                      if (slot) {
                          const style = TILE_COLORS[(tile.value - 1) % TILE_COLORS.length];
                          const el = document.createElement('div');
                          el.style.width = '100%';
                          el.style.height = '100%';
                          el.style.background = style.top;
                          el.style.borderRadius = '10px';
                          el.style.display = 'flex';
                          el.style.justifyContent = 'center';
                          el.style.alignItems = 'center';
                          el.style.fontWeight = '900';
                          el.style.fontSize = '20px';
                          el.style.color = style.text;
                          el.style.boxShadow = '0 4px 0 ' + style.side;
                          el.innerText = tile.value;
                          slot.appendChild(el);
                      }
                  });
              }

              function evaluateTrayMatches() {
                  const counts = {};
                  trayTiles.forEach(t => counts[t.value] = (counts[t.value] || 0) + 1);

                  let matchedVal = null;
                  for (let val in counts) {
                      if (counts[val] >= 3) { matchedVal = parseInt(val); break; }
                  }

                  if (matchedVal !== null) {
                      setTimeout(() => {
                          soundMatch();
                          trayTiles = trayTiles.filter(t => t.value !== matchedVal);
                          userState.coins += 10;
                          renderTrayUI();
                          checkWinCondition();
                      }, 180);
                  } else {
                      checkWinCondition();
                  }
              }

              function checkWinCondition() {
                  if (tiles3D.length === 0 && trayTiles.length === 0) {
                      clearInterval(timerInterval);
                      soundWin();
                      userState.coins += 50;

                      let starRating = secondsPassed < 45 ? '⭐⭐⭐' : (secondsPassed < 75 ? '⭐⭐' : '⭐');
                      userState.stars[activeLevel] = starRating;
                      if (activeLevel === userState.unlocked) userState.unlocked++;

                      saveState();
                      document.getElementById('win-stars-display').innerText = starRating;
                      document.getElementById('win-modal').style.display = 'flex';
                  } else if (trayTiles.length >= 7) {
                      clearInterval(timerInterval);
                      document.getElementById('lose-modal').style.display = 'flex';
                  }
              }

              function launchLevel(lvl) {
                  activeLevel = lvl;
                  document.getElementById('map-screen').classList.remove('active');
                  document.getElementById('game-screen').classList.add('active');
                  document.getElementById('hud-level-title').innerText = `Level ${lvl}`;

                  initCanvas();
                  generateSolvableLevel(lvl);

                  secondsPassed = 0;
                  clearInterval(timerInterval);
                  timerInterval = setInterval(() => {
                      secondsPassed++;
                      const mins = String(Math.floor(secondsPassed / 60)).padStart(2, '0');
                      const secs = String(secondsPassed % 60).padStart(2, '0');
                      document.getElementById('hud-timer').innerText = `⏱️ ${mins}:${secs}`;
                  }, 1000);
              }

              function exitToMap() {
                  clearInterval(timerInterval);
                  document.getElementById('game-screen').classList.remove('active');
                  document.getElementById('map-screen').classList.add('active');
                  renderSagaMap();
              }

              function claimWinAndNext() {
                  document.getElementById('win-modal').style.display = 'none';
                  exitToMap();
              }

              function retryLevel() {
                  document.getElementById('lose-modal').style.display = 'none';
                  launchLevel(activeLevel);
              }

              function triggerUndo() {
                  if (userState.coins >= 30 && historyStack.length > 0) {
                      userState.coins -= 30;
                      const lastTile = historyStack.pop();
                      trayTiles = trayTiles.filter(t => t.id !== lastTile.id);
                      tiles3D.push(lastTile);
                      updateTileBlocking();
                      renderCanvasStage();
                      renderTrayUI();
                  }
              }

              function triggerWand() {
                  if (userState.coins >= 100 && tiles3D.length >= 3) {
                      userState.coins -= 100;
                      const targetVal = tiles3D[0].value;
                      const matches = tiles3D.filter(t => t.value === targetVal).slice(0, 3);
                      matches.forEach(m => {
                          tiles3D = tiles3D.filter(t => t.id !== m.id);
                      });
                      updateTileBlocking();
                      renderCanvasStage();
                      checkWinCondition();
                  }
              }

              function triggerShuffle() {
                  if (userState.coins >= 50) {
                      userState.coins -= 50;
                      tiles3D.forEach(t => {
                          t.x += (Math.random() - 0.5) * 40;
                          t.y += (Math.random() - 0.5) * 40;
                      });
                      updateTileBlocking();
                      renderCanvasStage();
                  }
              }

              window.onload = () => {
                  renderSagaMap();
                  window.addEventListener('resize', () => {
                      if (document.getElementById('game-screen').classList.contains('active')) {
                          initCanvas();
                          renderCanvasStage();
                      }
                  });
                  document.getElementById('game-canvas').addEventListener('pointerdown', handleStageClick);
              };
          </script>
          </body>
          </html>
          EOF

      # Step 10: जब सारी फाइल्स बन जाएं, तब अंत में APK बिल्ड करना
      - name: Build Android APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # Step 11: बने हुए APK को GitHub Artifacts में अपलोड करना
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PirateMatch3D-Saga-APK
          path: app/build/outputs/apk/debug/app-debug.apk

